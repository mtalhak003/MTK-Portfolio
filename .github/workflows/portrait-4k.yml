name: Build 4K transparent hero portrait

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/portrait-4k.yml'
      - 'public/images/talha-cutout.svg'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upscale-portrait:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install Pillow
        run: python -m pip install --quiet Pillow
      - name: Create 4K transparent WebP
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageFilter
          import io, re, base64

          source = Path("public/images/talha-cutout.svg").read_text()
          match = re.search(r"href=\"data:image/(?:webp|png);base64,([^\"]+)\"", source)
          if not match:
              raise RuntimeError("Embedded portrait source not found")
          image = Image.open(io.BytesIO(base64.b64decode(match.group(1)))).convert("RGBA")
          image = image.resize((3072, 4096), Image.Resampling.LANCZOS)
          image = image.filter(ImageFilter.UnsharpMask(radius=1, percent=115, threshold=3))
          out = Path("public/images/talha-hero-4k.webp")
          image.save(out, format="WEBP", quality=82, method=4)
          print(f"Saved {out}, 3072x4096, {out.stat().st_size} bytes")
          PY
      - name: Commit 4K asset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/talha-hero-4k.webp
          if ! git diff --cached --quiet; then
            git commit -m "Generate 4K transparent portfolio portrait"
            git push
          fi
